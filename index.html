<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Un regalo que se descubre</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:#0b0f14; color:#eef2f6;
      display:grid; place-items:center; min-height:100vh; padding:24px;
    }
    .card{
      width:min(720px,100%);
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:20px; padding:28px;
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
    }
    h1{ margin:0 0 12px; font-size:22px; font-weight:700; letter-spacing:.2px;}
    p{ margin:10px 0; line-height:1.55; font-size:16px; color:rgba(238,242,246,0.92);}
    .muted{ color:rgba(238,242,246,0.70); font-size:14px;}
    .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .pill{
      display:inline-flex; gap:8px; align-items:center;
      padding:10px 12px; border-radius:999px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.12);
      font-size:14px;
    }
    .btn{
      margin-top:12px;
      display:inline-flex; align-items:center; justify-content:center;
      padding:12px 14px; border-radius:12px;
      background:rgba(255,255,255,0.14);
      border:1px solid rgba(255,255,255,0.16);
      color:#eef2f6; text-decoration:none; cursor:pointer; user-select:none;
      font-weight:650;
    }
    .btn.secondary{ background:rgba(255,255,255,0.08); }
    .btn:active{ transform:translateY(1px); }
    .hidden{ display:none; }
    .options{ display:grid; gap:10px; margin-top:10px; }
    .divider{ height:1px; background:rgba(255,255,255,0.12); margin:16px 0; }
    .ok{ color:#b6ffbf; }
  </style>
</head>

<body>
  <main class="card" role="main">
    <h1 id="title">Aquí se está cocinando un regalo…</h1>

    <!-- Vista marco seguro (siempre) -->
    <div id="frameView">
      <p><strong>Esto no es un “secreto grande”.</strong></p>
      <p class="muted">
        Lo primero es descubrir <strong>de qué se trata</strong>.
      </p>

      <div class="row">
        <span class="pill">Pistas: <span class="mono" id="progressPill">0/3</span></span>
        <span class="pill">Hoy: <span class="mono" id="nowPill"></span></span>
      </div>

      <div class="divider"></div>

      <div id="statusBox" class="muted"></div>

      <div class="row">
        <button class="btn" id="startBtn" type="button">Empezar / Continuar</button>
        <button class="btn secondary" id="resetBtn" type="button">Reiniciar</button>
      </div>

         </div>

    <!-- Vista juego -->
    <div id="gameView" class="hidden">
      <p class="muted">Pista <span class="mono" id="stepIndex"></span> de <span class="mono" id="stepTotal"></span></p>
      <p id="question"></p>

      <div class="options" id="options"></div>

      <p class="muted" id="afterText"></p>

      <div class="row">
        <button class="btn secondary" id="backBtn" type="button">Volver</button>
      </div>
    </div>

    <!-- Vista final -->
    <div id="finalView" class="hidden">
      <p class="ok"><strong>Listo.</strong></p>
      <p>Esto es una parte del regalo. Lo demás lo iremos abriendo con tiempo.</p>
      <a class="btn" id="openBtn" href="#" rel="noopener">Abrir</a>
      <div class="row">
        <button class="btn secondary" id="backBtn2" type="button">Volver</button>
      </div>
    </div>
  </main>

  <script>
    // =========================
    // ✅ CONFIGURACIÓN
    // =========================

    // Link público de Notion (regalo final)
    const NOTION_URL = "https://www.notion.so/Poco-a-poco-se-ir-descubriendo-este-regalo-para-ti-amor-de-mi-vida-2d3c5e5e071780a483e2f0eaebd0e7b0";

    // Endpoint de Sheet.best (ya me lo diste)
    const SHEET_ENDPOINT = "https://api.sheetbest.com/sheets/5ededac8-331b-478d-a1ff-bd766dd762ad";

    // IMPORTANTÍSIMO: Meses en JS → enero=0 ... diciembre=11
    const steps = [
      {
        unlockAt: new Date(2026, 0, 27, 12, 0, 0, 0), // 27 ene 2026 12:00
        title: "Adivina adivinador",
        q:
`Cierra los ojos por un momento y piensa en tu cumpleaños, junto a mí.

¿Qué es lo primero que se te viene a la cabeza?`,
        options: [
          "Un abrazo",
          "Playa",
          "Montaña"
        ],
        after:
"Piénsalo bien, puedes responder hasta 10 veces."
      },
      {
        unlockAt: new Date(2026, 1, 10, 12, 0, 0, 0), // 10 feb 2026 12:00
        title: "La confusión de la “sagrada familia”",
        q:
`A veces usamos palabras iguales para cosas distintas…
y aun así, nos entendimos.

Ese día supe que hablábamos el mismo idioma, y sí, hablo de La Sagrada Familia.

¿Qué fue lo más importante?`,
        options: [
          "Entendernos, aunque pensáramos distinto",
          "Reírnos del enredo",
          "Descubrir que caminaríamos el mismo sendero"
        ],
        after:
"Perfecto, amor de mi vida. Esta es la clase de pista que solo nosotros entendemos."
      },
      {
        unlockAt: new Date(2026, 1, 24, 12, 0, 0, 0), // 24 feb 2026 12:00
        title: "Nuestra primera misa juntos",
        q:
`La anterior solo era para hacerte sonreír.

No todo lo importante se planea.
Algunas cosas simplemente se comparten.

Entre el calor en la arena y la brisa del mar, el frío de mi ciudad natal,
y un lugar al que iremos del que llegaste a escuchar pero estoy seguro
de que no recuerdas

¿En cuál crees que llegarás a los 32 años de edad?`,
        options: [
          "Arena, mar y mi novio persiguiéndome",
          "Frío, lluvia, bohemia y mi novio abrazándome",
          "Mi novio abriéndome la puerta para bajarme en aquél misterioso lugar"
        ],
        after:
"No te imaginas cuánto te amo"
      }
    ];

    // Cuándo habilitas el botón final (Notion)
    // Si quieres que sea inmediatamente al completar la última pista, déjalo cercano.
    const finalUnlockAt = new Date(2026, 4, 24, 12, 5, 0, 0);

    // =========================
    // 🔒 LÓGICA (NO TOCAR)
    // =========================

    const storageKey = "gift_progress_v2";
    const frameView = document.getElementById("frameView");
    const gameView = document.getElementById("gameView");
    const finalView = document.getElementById("finalView");

    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const backBtn = document.getElementById("backBtn");
    const backBtn2 = document.getElementById("backBtn2");
    const openBtn = document.getElementById("openBtn");

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const afterText = document.getElementById("afterText");
    const statusBox = document.getElementById("statusBox");

    const stepIndexEl = document.getElementById("stepIndex");
    const stepTotalEl = document.getElementById("stepTotal");
    const progressPill = document.getElementById("progressPill");
    const nowPill = document.getElementById("nowPill");

    function fmt(d){
      try{
        return new Intl.DateTimeFormat(undefined,{
          year:"numeric", month:"2-digit", day:"2-digit",
          hour:"2-digit", minute:"2-digit"
        }).format(d);
      }catch{ return d.toString(); }
    }

    function loadProgress(){
      try{
        const raw = localStorage.getItem(storageKey);
        if(!raw) return { answered: [] };
        const parsed = JSON.parse(raw);
        if(!parsed.answered) parsed.answered = [];
        return parsed;
      }catch{
        return { answered: [] };
      }
    }

    function saveProgress(p){
      localStorage.setItem(storageKey, JSON.stringify(p));
    }

    function countAnswered(){
      return loadProgress().answered.length;
    }

    function nextAvailableStepIndex(now){
      const p = loadProgress();
      for(let i=0;i<steps.length;i++){
        const unlocked = now >= steps[i].unlockAt;
        const done = p.answered.some(x => x.step === i);
        if(unlocked && !done) return i;
      }
      return -1;
    }

    function nextLockedStepDate(now){
      for(const s of steps){
        if(now < s.unlockAt) return s.unlockAt;
      }
      return null;
    }

    function updateFrame(){
      const now = new Date();
      nowPill.textContent = fmt(now);

      const answered = countAnswered();
      progressPill.textContent = `${answered}/${steps.length}`;

      const idx = nextAvailableStepIndex(now);
      const nextLock = nextLockedStepDate(now);

      let msg = "";
      if(idx !== -1){
        msg = `Hay una pista disponible ahora.`;
      } else if(answered >= steps.length){
        if(now >= finalUnlockAt){
          msg = `Todas las pistas están listas. Puedes abrir el regalo cuando quieras.`;
        } else {
          msg = `Ya completaste todas las pistas. El regalo final se abrirá en su momento.`;
        }
      } else if(nextLock){
        msg = `La próxima pista se desbloquea el ${fmt(nextLock)} (hora local).`;
      } else {
        msg = `Vuelve más tarde.`;
      }
      statusBox.textContent = msg;
    }

    function showFrame(){
      frameView.classList.remove("hidden");
      gameView.classList.add("hidden");
      finalView.classList.add("hidden");
      updateFrame();
    }

    function showGame(stepIdx){
      const now = new Date();
      const p = loadProgress();
      const s = steps[stepIdx];

      if(now < s.unlockAt){ showFrame(); return; }
      if(p.answered.some(x => x.step === stepIdx)){ showFrame(); return; }

      frameView.classList.add("hidden");
      gameView.classList.remove("hidden");
      finalView.classList.add("hidden");

      stepTotalEl.textContent = String(steps.length);
      stepIndexEl.textContent = String(stepIdx + 1);

      questionEl.textContent = s.q;
      afterText.textContent = "";

      optionsEl.innerHTML = "";
      s.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.type = "button";
        btn.textContent = opt;

        btn.onclick = async () => {
          // 1) Guardar local (para continuidad en ese mismo dispositivo)
          const prog = loadProgress();
          prog.answered.push({ step: stepIdx, choice: i, at: new Date().toISOString() });
          saveProgress(prog);

          // 2) Enviar a Google Sheets vía Sheet.best (para que tú puedas verlas)
          //    IMPORTANTE: tu Sheet debe tener columnas con estos nombres:
          //    timestamp | step | title | choiceIndex | choiceText | userAgent
          //    (y opcionalmente pageUrl)
          try{
            await fetch(SHEET_ENDPOINT, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                timestamp: new Date().toISOString(),
                step: stepIdx + 1,
                title: s.title,
                choiceIndex: i,
                choiceText: opt,
                userAgent: navigator.userAgent,
                pageUrl: location.href
              })
            });
          }catch(e){
            // Silencioso: no rompemos la experiencia si falla la red
          }

          afterText.textContent = s.after;

          // 3) Volver al marco (o final si ya toca)
          setTimeout(() => {
            const now2 = new Date();
            const answered = countAnswered();
            if(answered >= steps.length && now2 >= finalUnlockAt){
              showFinal();
            } else {
              showFrame();
            }
          }, 2000);
        };

        optionsEl.appendChild(btn);
      });
    }

    function showFinal(){
      frameView.classList.add("hidden");
      gameView.classList.add("hidden");
      finalView.classList.remove("hidden");
      openBtn.href = NOTION_URL || "#";
    }

    startBtn.addEventListener("click", () => {
      const now = new Date();
      const answered = countAnswered();

      if(answered >= steps.length && now >= finalUnlockAt){
        showFinal();
        return;
      }

      const idx = nextAvailableStepIndex(now);
      if(idx !== -1){
        showGame(idx);
        return;
      }

      updateFrame();
    });

    resetBtn.addEventListener("click", () => {
      localStorage.removeItem(storageKey);
      showFrame();
    });

    backBtn.addEventListener("click", showFrame);
    backBtn2.addEventListener("click", showFrame);

    // Inicio
    showFrame();
  </script>
</body>
</html>
